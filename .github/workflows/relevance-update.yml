# Managed by Relevance (engine 1.0.5). Changes may be overwritten.
name: Relevance updates
run-name: "Check for updates${{ inputs.app && format(' · {0}', inputs.app) || '' }}"

on:
  schedule:
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: Only check this app (optional)
        type: string
        default: ''

permissions:
  contents: write
  actions: write
  issues: write
  id-token: write

concurrency:
  group: relevance-updates
  cancel-in-progress: false

jobs:
  check:
    name: Check apps and patches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check for updates [check]
        run: node .relevance/engine.mjs check --app "${{ inputs.app }}"
