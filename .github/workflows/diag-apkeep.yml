name: Diagnose apkeep
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch apkeep
        run: |
          curl -sSLo apkeep https://github.com/EFForg/apkeep/releases/download/1.1.0/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep && ./apkeep --version
      - name: List versions
        run: ./apkeep -l -a com.reddit.frontpage -d apk-pure -o output_format=json
      - name: Download 2026.40.0
        run: |
          mkdir out && time ./apkeep -a com.reddit.frontpage@2026.40.0 -d apk-pure -o acknowledge_dangers=true out
          ls -la out
      - name: Download an off-list older version
        run: |
          ./apkeep -a com.reddit.frontpage@2026.30.0 -d apk-pure -o acknowledge_dangers=true out || echo "exit $?"
          ls -la out
